name: Weekly pipeline run

# Mondays 03:30 UTC (09:00 IST), or on demand from the Actions tab.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      hunter_mode:
        description: "Hunter mode for this run (live spends up to ~5 searches)"
        type: choice
        options: [live, mock]
        default: live

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}   # auto-send validated drafts to MY_EMAIL
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      MY_EMAIL: ${{ secrets.MY_EMAIL }}
      HUNTER_MODE: ${{ inputs.hunter_mode || vars.HUNTER_MODE || 'live' }}
      PIPELINE_ENV: prod          # no on-disk caching on an ephemeral runner
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrate
        run: python main.py migrate
      - name: Stage 1 (fresh news into the pool)
        run: python main.py stage1
      - name: Batch run (syncs queued web work and learns first)
        run: python main.py run
      - name: Tests (rules still hold)
        if: always()
        run: python -m pytest -q
